server {
    listen 80;
    server_name app.perfas.com.tr;

    root /var/www/public;
    index index.php;

    # Vite build dosyalarını raw olarak servis et
    location /assets/ {
        try_files $uri $uri/;
    }

    # SPA route'ları (Vite frontend)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel PHP işlemleri
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Gizli dosyaları engelle
    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
