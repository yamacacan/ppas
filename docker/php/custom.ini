; ============================================================
; PPAS Özel PHP Ayarları
; 40 client + web UI için optimize edilmiş
; ============================================================
;BU AYARLAR 40 CLİENT İÇİN OPTİMİZE EDİLMİŞTİR. DAHA FAZLA CLİENT İÇİN AYARLAR GÜNCELLENMELİDİR.(AHMET CAN YAMAÇ)
; Upload limitleri
upload_max_filesize = 50M
post_max_size = 64M

; Bellek ve süre
memory_limit = 2G
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000

; Dosya yükleme
max_file_uploads = 20
file_uploads = On

; Oturum
session.gc_maxlifetime = 7200

; OPcache (performans)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
