[program:perfas-tagging-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/projects/ppas/artisan queue:work --queue=tagging --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=root
numprocs=8
redirect_stderr=true
stdout_logfile=/var/www/projects/ppas/storage/logs/tagging-worker.log
stopwaitsecs=3600
